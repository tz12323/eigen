[package]
name = "blas"
version = "5.0.0"

[targets.blas]
kind = "lib"
[build]
include_dirs = ["*", "!testing/"]
sources = [
    "single.cpp",
    "double.cpp",
    "complex_single.cpp",
    "complex_double.cpp",
    "xerbla.cpp",
    "f2c/srotm.c",
    "f2c/srotmg.c",
    "f2c/drotm.c",
    "f2c/drotmg.c",
    "f2c/lsame.c",
    "f2c/dspmv.c",
    "f2c/ssbmv.c",
    "f2c/chbmv.c",
    "f2c/sspmv.c",
    "f2c/zhbmv.c",
    "f2c/chpmv.c",
    "f2c/dsbmv.c",
    "f2c/zhpmv.c",
    "f2c/dtbmv.c",
    "f2c/stbmv.c",
    "f2c/ctbmv.c",
    "f2c/ztbmv.c",
    "f2c/complexdots.c",
]
required_features = ["blas"]
opt = 3
